let currentCardId = 33814470;
let historyStack = [33814470];
let historyIndex = 0;

function renderCard(id, recordHistory = true) {
  const card = CARDS[id];
  if (!card) return;
  currentCardId = id;

  if (recordHistory) {
    if (historyStack[historyIndex] !== id) {
      historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(id);
      historyIndex = historyStack.length - 1;
    }
  }

  updateHistoryUI();

  const detailEl = document.getElementById("card-detail-view");
  const localImg = localStorage.getItem("card_img_" + id) || EMBEDDED_CARD_IMAGES[id] || "";

  detailEl.innerHTML = `
    <div class="card-header-bar">
      <div>
        <span class="card-title-jp">${card.name}</span>
        <span class="card-kana">[${card.kana}]</span>
      </div>
      <span class="card-code">No.${Object.keys(CARDS).indexOf(id.toString()) + 1}</span>
    </div>

    <!-- Real Image Display -->
    <div class="card-stage-container">
      <div id="img-container-${id}" style="width:100%; display:flex; justify-content:center; align-items:center; min-height:360px;">
        ${localImg ? 
          `<img class="official-card-img" src="${localImg}" alt="${card.name}">` : 
          `<div style="text-align:center; padding:30px 10px; color:#aaa;">
             <div style="font-size:32px; margin-bottom:8px;">🎴</div>
             <div style="font-size:13px; font-weight:bold; color:#fff;">【${card.name}】</div>
             <div style="font-size:11px; margin-top:4px;">パスコード: ${id}</div>
             <div style="margin-top:14px;">
               <input type="file" id="picker-${id}" accept="image/*" style="display:none;" onchange="loadCardImage(event, ${id})">
               <button class="win-btn" onclick="document.getElementById('picker-${id}').click()">🖼️ 実物カード画像ファイルを選択</button>
             </div>
             <div style="font-size:10px; color:#888; margin-top:8px;">※一度選択すると端末内に永久保存され、以降は常時実物表示されます</div>
           </div>`
        }
      </div>
    </div>

    <div class="stats-grid">
      <span>【${card.type}】</span>
      <span>${card.lv} / 属性: [${card.attr}]</span>
      <span>攻${card.atk} / 守${card.def}</span>
    </div>

    <div class="official-text-box">
      ${card.text}
    </div>

    <div class="section-box box-role win-inset">
      <div class="section-title">💡 どういったカードなのか？ (役割と本質)</div>
      <div style="line-height:1.45;">${card.role}</div>
      <div style="margin-top:4px; font-size:11px; color:#444;">
        <strong>分類:</strong> ${card.category}
      </div>
    </div>

    <div class="section-box box-dest win-inset">
      <div class="section-title">🏁 どこまで盤面を持ってけるか？ (到達最終盤面)</div>
      <div style="line-height:1.55; white-space:pre-line;">${card.destination}</div>
    </div>

    <div class="section-box box-rule win-inset">
      <div class="section-title">⚖️ 実戦裁定・運用の急所</div>
      <div style="line-height:1.45; white-space:pre-line;">${card.rules}</div>
    </div>

    <div class="section-box win-inset" style="background:#fcfcfc;">
      <div class="section-title">🔗 接続ネットワーク (タップしてジャンプ)</div>
      <div class="network-grid">
        ${card.connections.map(c => `
          <button class="connect-link-btn" onclick="jumpToCard(${c.id})">
            <span class="tag-${c.tag === '呼出' ? 'call' : c.tag === '目標' ? 'dest' : 'mat'}">${c.tag}</span>
            <div style="flex:1;">
              <strong>${c.name}</strong>
              <div style="font-size:11px; color:#555;">${c.desc}</div>
            </div>
            <span style="font-size:14px; color:#000080;">➔</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById("status-bar-text").innerText = `表示中: ${card.name} [${card.category}]`;
  document.getElementById("main-viewport").scrollTop = 0;
  renderCardList();
}

function loadCardImage(event, id) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result;
    try {
      localStorage.setItem("card_img_" + id, base64);
    } catch(err) {
      console.warn("Storage full", err);
    }
    renderCard(id, false);
  };
  reader.readAsDataURL(file);
}

function jumpToCard(id) {
  renderCard(id, true);
  toggleDrawer(false);
}

function historyBack() {
  if (historyIndex > 0) {
    historyIndex--;
    renderCard(historyStack[historyIndex], false);
  }
}

function historyForward() {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    renderCard(historyStack[historyIndex], false);
  }
}

function updateHistoryUI() {
  document.getElementById("btn-back").disabled = (historyIndex <= 0);
  document.getElementById("btn-forward").disabled = (historyIndex >= historyStack.length - 1);

  const bar = document.getElementById("breadcrumb-bar");
  bar.innerHTML = historyStack.map((id, idx) => {
    const isCurrent = (idx === historyIndex);
    return `<span class="crumb-link" style="${isCurrent ? 'font-weight:bold; color:#000; text-decoration:none;' : ''}" onclick="goToHistoryIdx(${idx})">${CARDS[id].name}</span>`;
  }).join(' <span style="color:#888;">&gt;</span> ');
  bar.scrollLeft = bar.scrollWidth;
}

function goToHistoryIdx(idx) {
  historyIndex = idx;
  renderCard(historyStack[historyIndex], false);
}

function toggleDrawer(forceState) {
  const drawer = document.getElementById("card-drawer");
  const backdrop = document.getElementById("drawer-backdrop");
  const isOpen = (forceState !== undefined) ? forceState : !drawer.classList.contains("open");
  if (isOpen) {
    drawer.classList.add("open");
    backdrop.style.display = "block";
    renderCardList();
  } else {
    drawer.classList.remove("open");
    backdrop.style.display = "none";
  }
}

function renderCardList() {
  const query = (document.getElementById("filter-input")?.value || "").toLowerCase();
  const listEl = document.getElementById("drawer-card-list");
  listEl.innerHTML = Object.values(CARDS)
    .filter(c => c.name.toLowerCase().includes(query) || c.category.toLowerCase().includes(query) || c.kana.includes(query))
    .map(c => `
      <div class="drawer-item ${c.id === currentCardId ? 'active' : ''}" onclick="jumpToCard(${c.id})">
        <span style="font-weight:bold;">${c.name}</span>
        <span style="font-size:10px; opacity:0.8;">${c.type} / ${c.category}</span>
      </div>
    `).join('');
}

function showHelp() {
  alert("【完全自己完結版 ガイド】\n・模式図は一切排除し、本物の実物カード画像専用仕様です。\n・ローカル環境下でも「画像ファイルを選択」から1回選べば端末内にBase64で完全保存されます。");
}

window.onload = () => {
  renderCard(currentCardId, false);
};
